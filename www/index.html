<!DOCTYPE html>
<html lang="zh-hk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        PixelPet
    </title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7dd3c0">
    <script>
    // 桌面版由 Program.cs 在頁面建立前注入 window.__PETLANG__（該 exe 固定語言）。
    // 瀏覽器測試時可用 ?lang=ja 等參數模擬對應語言的 exe。
    // 有固定語言時替 <html> 加 exe-locked，CSS 會隱藏語言切換列，確保語言「不能改」。
    (function () {
        var m = /[?&]lang=([A-Za-z-]+)/.exec(location.search);
        if (m) window.__PETLANG__ = m[1];
        if (window.__PETLANG__) {
            document.documentElement.className += ' exe-locked';
        }
    })();
    </script>
</head>
<body>
    <div id="loading-screen">
        <h2 data-i18n="loading">
            載入中…
        </h2>
    </div>
    <div id="start-screen" class="hidden">
        <h2>
            PixelPet
        </h2>
        <p data-i18n="start.subtitle">
            你的像素寵物正在等你
        </p>
        <button id="btn-new-game" data-i18n="start.new">開始新遊戲</button>
        <button id="btn-continue" data-i18n="start.continue">繼續養育</button>
    </div>
    <div id="game-container" class="hidden">
        <header id="top-bar">
            <h1>
                PixelPet
            </h1>
            <div id="info-bar">
                <span id="pet-name">
                    -
                </span>
                <span id="pet-level">
                    Lv.
                    <span id="level-value">
                        1
                    </span>
                </span>
                <span id="game-time">
                    00:00
                </span>
            </div>
            <div id="lang-switcher">
                <button data-lang="zh-TW" class="lang-btn active">
                    繁體中文
                </button>
                <button data-lang="zh-CN">
                    简体中文
                </button>
                <button data-lang="en">
                    English
                </button>
                <button data-lang="ja">
                    日本語
                </button>
            </div>
            <!-- 音量控制：靜音按鈕 + 滑桿，設定會記住 -->
            <div id="volume-control">
                <button id="btn-mute" class="win-btn" title="靜音">&#x266B;</button>
                <input type="range" id="volume-slider" min="0" max="100" value="60" title="音量">
                <span id="volume-value">60</span>
            </div>
            <!-- 全螢幕按鈕：符號通用不需翻譯，title 由 I18n 提供 -->
            <button id="btn-fullscreen" class="win-btn" title="全螢幕 (F11)">&#x26F6;</button>
        </header>
        <main id="game-main">
            <div id="canvas-area">
                <canvas id="game-canvas" width="320" height="320">
                </canvas>
                <div id="scene-switcher">
                    <button data-scene="bedroom" data-i18n="scene.bedroom">
                        寢室
                    </button>
                    <button data-scene="livingroom" data-i18n="scene.livingroom">
                        客廳
                    </button>
                    <button data-scene="garden" data-i18n="scene.garden">
                        花園
                    </button>
                </div>
                <div id="mood-indicator">
                    <span data-i18n="label.mood">
                        情緒
                    </span>:
                    <span id="mood-value">
                        -
                    </span>
                </div>
            </div>
            <aside id="side-panel">
                <section id="stats-panel">
                    <h2 data-i18n="panel.stats">
                        寵物狀態
                    </h2>
                    <div id="stats-list">
                    </div>
                </section>
                <section id="affection-panel">
                    <h2 data-i18n="panel.affection">
                        親密度
                    </h2>
                    <div id="affection-bar">
                        <span id="affection-text">
                            0
                        </span>
                        <div id="affection-fill">
                        </div>
                    </div>
                </section>
                <section id="exp-panel">
                    <h2 data-i18n="panel.exp">
                        經驗值
                    </h2>
                    <div id="exp-bar">
                        <span id="exp-text">
                            0 / 100
                        </span>
                        <div id="exp-fill">
                        </div>
                    </div>
                </section>
                <section id="actions-panel">
                    <h2 data-i18n="panel.actions">
                        互動
                    </h2>
                    <div class="action-group">
                        <button data-action="feed" data-i18n="action.feed">
                            餵食
                        </button>
                        <button data-action="drink" data-i18n="action.drink">
                            喝水
                        </button>
                        <button data-action="clean" data-i18n="action.clean">
                            清潔
                        </button>
                        <button data-action="sleep" data-i18n="action.sleep">
                            睡覺
                        </button>
                        <button data-action="toilet" data-i18n="action.toilet">
                            上廁所
                        </button>
                    </div>
                    <div class="action-group">
                        <button data-action="play" data-i18n="action.play">
                            玩耍
                        </button>
                        <button data-action="train" data-i18n="action.train">
                            訓練
                        </button>
                        <button data-action="walk" data-i18n="action.walk">
                            散步
                        </button>
                        <button data-action="chat" data-i18n="action.chat">
                            聊天
                        </button>
                    </div>
                    <div class="action-group">
                        <button data-action="skills" data-i18n="action.skills">
                            技能
                        </button>
                        <button data-action="dex" data-i18n="action.dex">
                            圖鑑
                        </button>
                        <button data-action="diary" data-i18n="action.diary">
                            日誌
                        </button>
                        <button data-action="share" data-i18n="action.share">
                            狀態卡
                        </button>
                    </div>
                </section>
            </aside>
        </main>
        <footer id="bottom-panel">
            <div id="dialogue-box">
                <p id="dialogue-text" data-i18n="dialogue.welcome">
                    歡迎來到 PixelPet！你的像素寵物正在等你。
                </p>
            </div>
            <div id="event-box" class="hidden">
                <h3 id="event-title" data-i18n="label.event">
                    事件
                </h3>
                <p id="event-desc" data-i18n="label.event-desc">
                </p>
                <div id="event-choices">
                </div>
            </div>
            <div id="diary-panel" class="hidden overlay">
                <h3 id="diary-title" data-i18n="label.diary">
                    日誌
                </h3>
                <div id="diary-entries">
                </div>
                <button id="diary-close" data-close="diary-panel" data-i18n="action.close">
                    關閉
                </button>
            </div>
            <div id="skills-panel" class="hidden overlay">
                <h3 data-i18n="label.skills">
                    技能
                </h3>
                <div id="skills-list">
                </div>
                <button id="skills-close" data-close="skills-panel" data-i18n="action.close">
                    關閉
                </button>
            </div>
            <div id="dex-panel" class="hidden overlay">
                <h3 data-i18n="label.dex">
                    圖鑑
                </h3>
                <div id="dex-list">
                </div>
                <button id="dex-close" data-close="dex-panel" data-i18n="action.close">
                    關閉
                </button>
            </div>
            <div id="share-panel" class="hidden overlay">
                <h3 data-i18n="label.share">
                    狀態卡
                </h3>
                <canvas id="share-canvas" width="600" height="800">
                </canvas>
                <button id="share-download" data-i18n="button.download">
                    下載圖片
                </button>
                <button id="share-close" data-close="share-panel" data-i18n="action.close">
                    關閉
                </button>
            </div>
        </footer>
    </div>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/pet.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/assets-loader.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/events.js"></script>
    <script src="js/growth.js"></script>
    <script src="js/diary.js"></script>
    <script src="js/audio.js"></script>
    <script src="main.js"></script>
</body>
</html>
